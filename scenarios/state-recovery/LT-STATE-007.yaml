version: 1
id: LT-STATE-007
title: Reject a plan proposal and keep the applied revision unchanged
risk: high
kind: deterministic
tags: [state, reject, revision_fence, read_only]
preconditions:
  - fresh durable database (a new SQLite file unique to this run)
  - unique disposable workspace created by the runner
  - planner and executor replaced by local read_only fixture doubles
setup: []
actions:
  - step: 1
    name: create_goal_auto
    do: Create one read_only goal in planningMode auto so revision 1 is applied
      and the goal is RUNNING.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" create-goal --planner static-success --executor succeed --mode auto
      must_succeed: true
    observe: task.json goal state RUNNING, revision 1
  - step: 2
    name: edit_goal_creates_proposal
    do: Edit the original goal; this pauses the scheduler and proposes a fenced
      replacement revision 2 (append-only goal version + PlanProposed).
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" edit-goal --objective "revised read-only objective" --reason "user correction"
      must_succeed: true
    observe: goal state AWAITING_CONFIRMATION, revision 1; PlanProposed revision 2
  - step: 3
    name: reject_proposal
    do: Reject the proposed replacement at the current control revision.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" reject-goal --expected-revision 0
      must_succeed: true
    observe: PlanRejected event; goal returns to RUNNING at revision 1
hard_assertions:
  - id: HA-1
    oracle: rejected_event
    check: The event log records the PlanRejected event.
    evaluate:
      oracle: event_present
      type: PlanRejected
  - id: HA-2
    oracle: current_revision_unchanged
    check: The applied plan revision remains 1 (snapshot goal.revision == 1) —
      rejection never advances the applied revision.
    evaluate:
      oracle: json_field_equals
      file: snapshot.json
      field: goal.revision
      expected: 1
  - id: HA-3
    oracle: running_again
    check: After rejection the goal returns to RUNNING (restoreState RUNNING).
    evaluate:
      oracle: json_field_equals
      file: snapshot.json
      field: goal.state
      expected: RUNNING
  - id: HA-4
    oracle: proposal_not_applied
    check: Revision 2 was proposed but never applied (no PlanRevisionApplied
      event with revision 2 — assert the applied events stayed at revision 1).
    evaluate:
      oracle: event_field_equals
      type: PlanRevisionApplied
      field: payload.revision
      expected: 1
  - id: HA-5
    oracle: no_external_effect
    check: No external-effect signal appears anywhere in the evidence.
    evaluate:
      oracle: no_external_effect
evidence_required: [run, command_log, task, events, runtime_snapshot, artifacts, assertions, environment]
llm_review: on_failure
expected_user_outcome: The user rejects a proposed replacement plan; the current
  applied revision stays intact and the task returns to a runnable state.
cleanup: delete_disposable_workspace
side_effect_class: read_only
