version: 1
id: LT-STATE-004
title: Pause a running read-only goal durably
risk: high
kind: deterministic
tags: [state, pause, durability, read_only]
preconditions:
  - fresh durable database (a new SQLite file unique to this run)
  - unique disposable workspace created by the runner
  - planner and executor replaced by local read_only fixture doubles
setup: []
actions:
  - step: 1
    name: create_goal_auto
    do: Create one read_only goal in planningMode auto so the plan is applied
      immediately and the goal is RUNNING (revision 1) with no attempt started.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" create-goal --planner static-success --executor succeed --mode auto
      must_succeed: true
    observe: task.json goal state RUNNING, revision 1
  - step: 2
    name: pause_goal
    do: Pause the running goal through the lifecycle control.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" pause-goal
      must_succeed: true
    observe: snapshot.json goal.state PAUSED with a durable pause reason
hard_assertions:
  - id: HA-1
    oracle: paused_state
    check: The goal is durably PAUSED after the pause control.
    evaluate:
      oracle: json_field_equals
      file: snapshot.json
      field: goal.state
      expected: PAUSED
  - id: HA-2
    oracle: pause_reason_recorded
    check: The pause carries a durable reason (snapshot goal.pauseReason is a
      non-empty string).
    evaluate:
      oracle: json_field_matches
      file: snapshot.json
      field: goal.pauseReason
      pattern: .+
  - id: HA-3
    oracle: no_work_completed
    check: No attempt started and no goal success was recorded while paused.
    evaluate:
      oracle: event_absent
      type: TaskAttemptStarted
  - id: HA-4
    oracle: no_success_while_paused
    check: The goal did not succeed during the pause window.
    evaluate:
      oracle: event_absent
      type: GoalSucceeded
  - id: HA-5
    oracle: no_external_effect
    check: No external-effect signal appears anywhere in the evidence.
    evaluate:
      oracle: no_external_effect
  - id: HA-6
    oracle: pause_command_ok
    check: The pause-goal harness command exited 0.
    evaluate:
      oracle: command_exit_code_equals
      command: pause_goal
      expected: 0
evidence_required: [run, command_log, task, events, runtime_snapshot, artifacts, assertions, environment]
llm_review: on_failure
expected_user_outcome: The user pauses a running read-only task and the paused
  state with its reason survives durably; no work runs while paused.
cleanup: delete_disposable_workspace
side_effect_class: read_only
