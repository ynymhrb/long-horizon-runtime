version: 1
id: LT-RECOVERY-005
title: A duplicate resume request never creates a concurrent attempt
risk: high
kind: deterministic
tags: [recovery, resume, idempotency, read_only]
preconditions:
  - fresh durable database (a new SQLite file unique to this run)
  - unique disposable workspace created by the runner
  - planner and executor replaced by local read_only fixture doubles
setup: []
actions:
  - step: 1
    name: create_goal_auto
    do: Create one read_only goal in planningMode auto.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" create-goal --planner static-success --executor succeed --mode auto
      must_succeed: true
    observe: task.json goal state RUNNING, revision 1
  - step: 2
    name: pause_goal
    do: Pause the running goal.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" pause-goal
      must_succeed: true
    observe: snapshot.json goal.state PAUSED
  - step: 3
    name: first_resume
    do: Resume the paused goal and run it to completion (one attempt).
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" resume-goal --run --planner static-success --executor succeed
      must_succeed: true
    observe: snapshot.json goal.state SUCCEEDED, attempts 1
  - step: 4
    name: duplicate_resume
    do: Issue a second resume on the now-terminal goal; the runtime must refuse
      it rather than dispatch a concurrent attempt.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" resume-goal --run --planner static-success --executor succeed
      must_succeed: false
    observe: resume-goal exits non-zero with "cannot be resumed while SUCCEEDED";
      no new attempt appears
hard_assertions:
  - id: HA-1
    oracle: one_attempt_total
    check: Exactly one attempt exists after both resumes — the duplicate request
      never dispatched concurrent work.
    evaluate:
      oracle: attempt_count_equals
      expected: 1
  - id: HA-2
    oracle: duplicate_refused
    check: The duplicate resume command exited non-zero (the runtime refused the
      resume on a terminal goal).
    evaluate:
      oracle: command_exit_code_equals
      command: duplicate_resume
      expected: 1
  - id: HA-3
    oracle: goal_remains_succeeded
    check: The goal stays SUCCEEDED after the refused duplicate resume.
    evaluate:
      oracle: json_field_equals
      file: snapshot.json
      field: goal.state
      expected: SUCCEEDED
  - id: HA-4
    oracle: no_concurrent_attempt_event
    check: Exactly one TaskAttemptStarted exists in the event log (no duplicate
      dispatch).
    evaluate:
      oracle: event_present
      type: TaskAttemptStarted
  - id: HA-5
    oracle: no_external_effect
    check: No external-effect signal appears anywhere in the evidence.
    evaluate:
      oracle: no_external_effect
evidence_required: [run, command_log, task, events, runtime_snapshot, artifacts, assertions, environment]
llm_review: on_failure
expected_user_outcome: Sending a duplicate resume never spawns a second
  concurrent attempt; the runtime refuses it and the completed task stays
  untouched.
cleanup: delete_disposable_workspace
side_effect_class: read_only
