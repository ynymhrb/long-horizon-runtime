version: 1
id: LT-RECOVERY-001
title: Restart after a completed goal reconstructs state identically
risk: critical
kind: deterministic
tags: [recovery, restart, reconstruction, read_only]
preconditions:
  - fresh durable database (a new SQLite file unique to this run)
  - unique disposable workspace created by the runner
  - planner and executor replaced by local read_only fixture doubles
setup: []
actions:
  - step: 1
    name: create_goal_auto
    do: Create one read_only goal in planningMode auto.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" create-goal --planner static-success --executor succeed --mode auto
      must_succeed: true
    observe: task.json goal state RUNNING, revision 1
  - step: 2
    name: run_until_success
    do: Drive the goal to a terminal success (one attempt).
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" run-goal --planner static-success --executor succeed
      must_succeed: true
    observe: snapshot.json goal.state SUCCEEDED, attempts 1
  - step: 3
    name: restart_and_reexport
    do: Simulate a runtime restart by opening the same durable database in a
      fresh process and re-exporting state; the projection must reconstruct
      identically.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" run-goal --planner static-success --executor succeed
      must_succeed: true
    observe: snapshot.json goal.state SUCCEEDED, attempts still 1
hard_assertions:
  - id: HA-1
    oracle: state_reconstructed
    check: After restart the goal reconstructs to SUCCEEDED — the same durable
      state as before.
    evaluate:
      oracle: json_field_equals
      file: snapshot.json
      field: goal.state
      expected: SUCCEEDED
  - id: HA-2
    oracle: no_duplicate_attempts
    check: Restart never re-runs completed work — exactly one attempt exists.
    evaluate:
      oracle: attempt_count_equals
      expected: 1
  - id: HA-3
    oracle: goal_id_stable
    check: The goal id is stable across restart (task.json count == 1).
    evaluate:
      oracle: json_field_equals
      file: task.json
      field: count
      expected: 1
  - id: HA-4
    oracle: artifact_reconstructed
    check: The validated artifact produced by the run is still projected in the
      artifact manifest.
    evaluate:
      oracle: json_field_equals
      file: artifacts.json
      field: count
      expected: 1
  - id: HA-5
    oracle: no_external_effect
    check: No external-effect signal appears anywhere in the evidence.
    evaluate:
      oracle: no_external_effect
evidence_required: [run, command_log, task, events, runtime_snapshot, artifacts, assertions, environment]
llm_review: on_failure
expected_user_outcome: Restarting the runtime after a completed read-only task
  reconstructs the goal, attempts and artifacts identically, with no re-execution.
cleanup: delete_disposable_workspace
side_effect_class: read_only
