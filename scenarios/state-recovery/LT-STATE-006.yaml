version: 1
id: LT-STATE-006
title: Cancel a running goal without retries or late work
risk: high
kind: deterministic
tags: [state, cancel, terminal, read_only]
preconditions:
  - fresh durable database (a new SQLite file unique to this run)
  - unique disposable workspace created by the runner
  - planner and executor replaced by local read_only fixture doubles
setup: []
actions:
  - step: 1
    name: create_goal_auto
    do: Create one read_only goal in planningMode auto (RUNNING, revision 1).
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" create-goal --planner static-success --executor succeed --mode auto
      must_succeed: true
    observe: task.json goal state RUNNING, revision 1
  - step: 2
    name: cancel_goal
    do: Cancel the running goal.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" cancel-goal
      must_succeed: true
    observe: snapshot.json goal.state CANCELLED
  - step: 3
    name: attempt_work_after_cancel
    do: Try to drive the cancelled goal; no work may start or retry after
      cancellation.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" run-goal --planner static-success --executor succeed
      must_succeed: true
    observe: goal remains CANCELLED with no TaskAttemptStarted
hard_assertions:
  - id: HA-1
    oracle: cancelled_state
    check: The goal is durably CANCELLED.
    evaluate:
      oracle: json_field_equals
      file: snapshot.json
      field: goal.state
      expected: CANCELLED
  - id: HA-2
    oracle: cancel_event
    check: The event log records the GoalCancelled event.
    evaluate:
      oracle: event_present
      type: GoalCancelled
  - id: HA-3
    oracle: no_attempt_after_cancel
    check: No attempt ever started on the cancelled goal (no TaskAttemptStarted).
    evaluate:
      oracle: event_absent
      type: TaskAttemptStarted
  - id: HA-4
    oracle: no_success
    check: The cancelled goal never reached GoalSucceeded.
    evaluate:
      oracle: event_absent
      type: GoalSucceeded
  - id: HA-5
    oracle: no_external_effect
    check: No external-effect signal appears anywhere in the evidence.
    evaluate:
      oracle: no_external_effect
evidence_required: [run, command_log, task, events, runtime_snapshot, artifacts, assertions, environment]
llm_review: on_failure
expected_user_outcome: The user cancels a running read-only task; it terminalizes
  as cancelled and no further work is dispatched or retried.
cleanup: delete_disposable_workspace
side_effect_class: read_only
