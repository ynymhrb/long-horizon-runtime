version: 1
id: LT-STATE-008
title: Accept a safe pending replan with a valid revision fence
risk: high
kind: deterministic
tags: [state, replan, accept, revision_fence, read_only]
preconditions:
  - fresh durable database (a new SQLite file unique to this run)
  - unique disposable workspace created by the runner
  - planner and executor replaced by local read_only fixture doubles
setup: []
actions:
  - step: 1
    name: create_goal_auto
    do: Create one read_only goal in planningMode auto so revision 1 is applied
      and the goal is RUNNING.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" create-goal --planner static-success --executor succeed --mode auto
      must_succeed: true
    observe: task.json goal state RUNNING, revision 1
  - step: 2
    name: edit_goal_creates_proposal
    do: Edit the original goal; this proposes a fenced replacement revision 2.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" edit-goal --objective "revised read-only objective" --reason "user correction"
      must_succeed: true
    observe: goal AWAITING_CONFIRMATION at revision 1; PlanProposed revision 2
  - step: 3
    name: accept_stale_revision
    do: Try to accept the proposal with a stale expected control revision; the
      revision fence must reject it.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" accept-replan --expected-revision 5
      must_succeed: true
    observe: accept-replan reports kind conflict (stale control revision)
  - step: 4
    name: accept_current_revision
    do: Accept the proposal at the current control revision; the fenced revision
      becomes current and the goal resumes.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" accept-replan --expected-revision 0
      must_succeed: true
    observe: accept-replan reports kind applied; goal RUNNING at revision 2
  - step: 5
    name: run_until_idle
    do: Drive the goal until idle so the accepted plan executes.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" run-goal --planner static-success --executor succeed
      must_succeed: true
    observe: snapshot.json goal.state SUCCEEDED
hard_assertions:
  - id: HA-1
    oracle: accepted_revision_current
    check: The accepted revision 2 became current and the goal ran to SUCCEEDED.
    evaluate:
      oracle: json_field_equals
      file: snapshot.json
      field: goal.state
      expected: SUCCEEDED
  - id: HA-2
    oracle: revision_two_applied
    check: The applied revision is 2 after acceptance.
    evaluate:
      oracle: json_field_equals
      file: snapshot.json
      field: goal.revision
      expected: 2
  - id: HA-3
    oracle: accept_event_order
    check: The durable event order shows proposal, confirmation and applied
      revision 2 after the fence held.
    evaluate:
      oracle: event_order
      sequence: [PlanProposed, PlanConfirmed, PlanRevisionApplied]
  - id: HA-4
    oracle: stale_revision_conflict
    check: The stale expected revision (5) produced a conflict — the command log
      records the accept-stale step succeeded (exit 0) and no PlanConfirmed
      existed before the current-revision accept.
    evaluate:
      oracle: command_exit_code_equals
      command: accept_stale_revision
      expected: 0
  - id: HA-5
    oracle: no_external_effect
    check: No external-effect signal appears anywhere in the evidence.
    evaluate:
      oracle: no_external_effect
evidence_required: [run, command_log, task, events, runtime_snapshot, artifacts, assertions, environment]
llm_review: on_failure
expected_user_outcome: The user accepts a safe pending replan; the revision fence
  holds (a stale revision is refused) and the accepted revision becomes current
  and runs to success.
cleanup: delete_disposable_workspace
side_effect_class: read_only
