version: 1
id: LT-UI-004
title: Jump to the current session from the Cockpit
risk: medium
kind: exploratory_ui
tags: [ui, task_area, navigation, session, read_only]
preconditions:
  - fresh durable database (a new SQLite file unique to this run)
  - unique disposable workspace created by the runner
  - local DSH Web host is running with the long-task-runtime plugin installed into a
    disposable profile (never the operator profile and never a user-layer patch)
  - browser automation is pointed at the local host with an empty session
setup:
  - Build the plugin once and add it to a disposable DSH Web profile via
    `dsh plugin --profile <disposable> add <path-to-build>`; do not touch
    C:\Users\19632\.dsh profile/patch or agent presets.
  - Start the local DSH Web host on a free port that is NOT 3003, 3004, or 3080
    (Clowder reserves 3003/3004 and 3080 is the operator GUI); record the chosen
    URL in environment.json.
  - Seed one read_only goal in a confirmed/active state with no attached session
    (fresh database guarantees no session link exists for the browser session).
  - Open the Task Area from the host sidebar in the browser and open the goal's
    Cockpit.
actions:
  - step: 1
    name: open_cockpit_without_session_link
    do: Open the Task Area and open the Cockpit for the goal that has no attached
      session.
    observe: The "当前会话" button is visible in the header; capture screenshot
      task-cockpit-jump-button.png and record the getTaskNavigation DTO.
  - step: 2
    name: invoke_jump_without_link
    do: Click the "当前会话" button while no session is attached.
    observe: An actionable error/guidance message appears telling the user to
      attach the current session first; capture screenshot
      task-cockpit-jump-guidance.png and record the visible message text.
  - step: 3
    name: verify_attach_guidance_is_actionable
    do: Read the guidance message and confirm it names the attach control.
    observe: The message references "附加到当前会话" so the user knows the next
      step; capture screenshot task-cockpit-attach-guidance.png.
  - step: 4
    name: confirm_no_unexpected_navigation
    do: Confirm the browser did not navigate away from the current session.
    observe: The host session id in the URL / session store is unchanged; record
      the getTaskNavigation DTO again to confirm no binding was created.
hard_assertions:
  - id: HA-1
    oracle: jump_button_visible
    check: The Cockpit header shows the exact visible button label "当前会话"
      while a sessionId is present in the page.
  - id: HA-2
    oracle: navigation_dto_shape
    check: The getTaskNavigation DTO for the goal returns an object with an
      attachedSessionIds array and no currentSessionId (or a currentSessionId
      undefined) before any attach action.
  - id: HA-3
    oracle: actionable_attach_guidance_visible
    check: Clicking "当前会话" with no attached session renders a visible,
      actionable guidance message containing the exact text "附加到当前会话"
      (or the exact documented guidance string), telling the user how to bind the
      session; the message is not a raw error code.
  - id: HA-4
    oracle: no_unexpected_navigation
    check: After the jump attempt with no attached session, the browser session id
      is unchanged and getTaskNavigation still reports no currentSessionId, so the
      UI did not fabricate a binding or navigate to an unrelated session.
  - id: HA-5
    oracle: no_external_effect
    check: No action in this scenario triggered an external_effect; the only
      writable targets were the disposable workspace, the disposable profile, and
      the fresh durable database.
evidence_required: [events, runtime_snapshot, command_log, screenshots, task, assertions, environment]
llm_review: always
expected_user_outcome: The user either jumps to the task's bound session or receives
  clear, actionable guidance to attach one, and is never silently redirected or
  left without a next step.
cleanup: delete_disposable_workspace
ui:
  execution_mode: manual_browser
  host: local_dsh_web
  port_constraint: free port excluding 3003, 3004 and 3080
  planned_side_effect_class: read_only
  review_focus:
    - jump control is visible and behaves predictably
    - attach guidance is actionable when no session is bound
    - no silent or incorrect navigation
