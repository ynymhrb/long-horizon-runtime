version: 1
id: LT-UI-002
title: Inspect a failed task without raw event names
risk: high
kind: exploratory_ui
tags: [ui, task_area, failure_presentation, read_only]
preconditions:
  - fresh durable database (a new SQLite file unique to this run)
  - unique disposable workspace created by the runner
  - local DSH Web host is running with the long-task-runtime plugin installed into a
    disposable profile (never the operator profile and never a user-layer patch)
  - browser automation is pointed at the local host with an empty session
setup:
  - Build the plugin once and add it to a disposable DSH Web profile via
    `dsh plugin --profile <disposable> add <path-to-build>`; do not touch
    C:\Users\19632\.dsh profile/patch or agent presets.
  - Start the local DSH Web host on a free port that is NOT 3003, 3004, or 3080
    (Clowder reserves 3003/3004 and 3080 is the operator GUI); record the chosen
    URL in environment.json.
  - Seed one read_only goal whose plan execution reaches a terminal failure
    (e.g. a validator rejects a task output so a TaskFailed event is durably
    recorded) so the goal state is FAILED and the task remains inspectable.
  - Open the Task Area from the host sidebar in the browser.
actions:
  - step: 1
    name: open_failed_task_in_list
    do: Open the Task Area and locate the failed task in the default list.
    observe: The task row shows the visible state label "失败"; capture screenshot
      task-area-list-failed.png and record the listTasks DTO item.
  - step: 2
    name: open_failed_task_cockpit
    do: Click the failed task row to open its Cockpit.
    observe: The Cockpit header shows the goal id, its revision, and the state
      badge "失败"; capture screenshot task-cockpit-failed.png and record the
      getTask / getTaskGraph / listTaskEvents DTO responses.
  - step: 3
    name: read_failure_timeline
    do: Read the recent-events timeline in the inspector panel.
    observe: The failure row shows a human-readable label ("节点失败" or
      "节点尝试失败") and a detail line, never the raw event type string;
      capture screenshot task-cockpit-failure-timeline.png.
  - step: 4
    name: check_safe_next_action
    do: Confirm the failure view still offers a safe next action.
    observe: The "删除" (archive) control and the plan-hint line remain visible so
      the user is not stranded; capture screenshot task-cockpit-failed-actions.png.
hard_assertions:
  - id: HA-1
    oracle: failed_list_label_visible
    check: The default listTasks DTO contains the goal with state FAILED, and its
      rendered row shows the exact visible state label "失败".
  - id: HA-2
    oracle: cockpit_failed_label_visible
    check: The Cockpit state badge shows the exact visible label "失败" and the
      header shows the goal id and "修订 <revision>".
  - id: HA-3
    oracle: failure_reason_visible_without_raw_event_names
    check: The recent-events timeline renders the failure through formatTaskEvent
      with a human-readable label (one of "节点失败" or "节点尝试失败") and a
      non-empty detail line; the raw internal event type strings "TaskFailed" and
      "TaskAttemptFailed" do NOT appear as visible text in the timeline.
  - id: HA-4
    oracle: safe_next_action_visible
    check: The "删除" control and the plan-hint line are visible in the failed
      Cockpit, giving the user an explicit safe next action (archive) and an
      explanation of how replanning works.
  - id: HA-5
    oracle: dto_state_consistent
    check: The getTask DTO reports state FAILED; the visible badge matches the DTO
      state via the taskStatePresentation mapping.
  - id: HA-6
    oracle: no_external_effect
    check: No action in this scenario triggered an external_effect; the only
      writable targets were the disposable workspace, the disposable profile, and
      the fresh durable database.
evidence_required: [events, runtime_snapshot, command_log, screenshots, task, assertions, environment]
llm_review: always
expected_user_outcome: The user can see that the task failed, understand the failure
  through a readable reason, and identify a safe next action without being exposed
  to internal event names or a stuck loading view.
cleanup: delete_disposable_workspace
ui:
  execution_mode: manual_browser
  host: local_dsh_web
  port_constraint: free port excluding 3003, 3004 and 3080
  planned_side_effect_class: read_only
  review_focus:
    - failure reason is visible and readable
    - a safe next action is available
    - no raw internal event names in the user-facing timeline
