version: 1
id: LT-FAULT-003
title: Missing task contract field
risk: high
kind: fault_injection
tags: [fault_injection, planner, contract, plan_validation, read_only]
preconditions:
  - fresh durable database (a new SQLite file unique to this run)
  - unique disposable workspace created by the runner
  - planner adapter replaced by a local test double inside the disposable workspace
setup:
  - The runtime harness fixture planner kind missing-field returns a PlanDraft
    in which one task omits a required contract field (sideEffectClass is
    explicitly undefined) while remaining read_only and acyclic. Plan
    validation must reject the draft atomically, never projecting the
    incomplete task as runnable.
actions:
  - step: 1
    name: create_goal
    do: Create one read_only goal in planningMode auto against the fresh durable
      database through the runtime harness with the missing-field planner
      fixture, so planWithValidation runs validatePlan on the contract-incomplete
      PlanDraft exactly once and the rejection is recorded durably.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" create-goal --planner missing-field --executor succeed --mode auto
      must_succeed: true
    observe: events.json GoalCreated then GoalFailed(phase planning, reason names the missing field)
  - step: 2
    name: export_state
    do: Export the durable goal projection, plan revision list, event log and
      artifact manifest into the staging directory so the runner imports them
      into the immutable evidence bundle.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" export-state
      must_succeed: true
    observe: task.json, events.json, snapshot.json, artifacts.json staged
hard_assertions:
  - id: HA-1
    oracle: plan_rejection_atomic
    check: validatePlan rejects the contract-incomplete draft atomically: no
      PlanRevisionApplied event exists and the durable GoalFailed reason names
      the missing required field.
    evaluate:
      oracle: event_absent
      type: PlanRevisionApplied
  - id: HA-2
    oracle: missing_field_reason_recorded
    check: The durable failure reason for the incomplete plan names the missing
      required field.
    evaluate:
      oracle: json_field_matches
      file: events.json
      field: events.1.payload.reason
      pattern: is required
  - id: HA-3
    oracle: no_partial_projection
    check: The rejected plan leaves zero plan projection behind: no PlanProposed
      event and snapshot.json plan is null (the incomplete task is never
      projected as runnable).
    evaluate:
      oracle: event_absent
      type: PlanProposed
  - id: HA-4
    oracle: no_plan_persisted
    check: getPlan(goalId) is undefined; snapshot.json plan is null.
    evaluate:
      oracle: json_field_equals
      file: snapshot.json
      field: plan
      expected: null
  - id: HA-5
    oracle: revision_stays_zero
    check: The goal revision remains 0 (no revision was ever applied).
    evaluate:
      oracle: json_field_equals
      file: snapshot.json
      field: goal.revision
      expected: 0
  - id: HA-6
    oracle: no_external_effect
    check: No event or snapshot entry carries sideEffectClass external_effect;
      the only writable targets were the disposable workspace and the fresh
      durable database.
    evaluate:
      oracle: no_external_effect
  - id: HA-7
    oracle: command_exit_code_equals
    check: The harness create-goal command exited 0 (the runtime recorded the
      rejection durably instead of crashing the caller).
    evaluate:
      oracle: command_exit_code_equals
      command: create_goal
      expected: 0
evidence_required: [events, runtime_snapshot, command_log, task, assertions, environment]
llm_review: on_failure
expected_user_outcome: The contract-incomplete plan is rejected atomically; the
  user is not shown a runnable plan and no task is dispatched.
cleanup: delete_disposable_workspace
fault_injection:
  boundary: The fault is injected only through a local PlannerAdapter fixture
    double inside the disposable workspace and the fresh durable database.
    Tracked source, configuration and tests of long-task-runtime are never modified.
  injected_fault: planner returns a PlanDraft with a required task contract field
    explicitly undefined
  planned_side_effect_class: read_only
