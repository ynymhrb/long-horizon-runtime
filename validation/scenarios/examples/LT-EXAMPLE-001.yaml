version: 1
id: LT-EXAMPLE-001
title: Create a read-only goal and run it to a durable success
risk: medium
kind: deterministic
tags: [state, create, run, read_only, example]
preconditions:
  - fresh durable database (a new SQLite file unique to this run)
  - unique disposable workspace created by the runner
  - planner and executor replaced by local read_only fixture doubles
setup: []
actions:
  - step: 1
    name: create_goal
    do: Create one read_only goal in planningMode auto through the runtime
      harness against the fresh durable database; the fixture planner returns a
      single read_only task.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" create-goal --planner static-success --executor succeed --mode auto
      must_succeed: true
    observe: commands.ndjson exit code; task.json goal id, state RUNNING, revision 1
  - step: 2
    name: run_until_idle
    do: Drive the goal until idle with a live parent so the read_only task
      executes once and terminalizes; export the durable state afterwards.
    run:
      command: node "%LT_RUNNER_DIR%\harness.mjs" run-goal --planner static-success --executor succeed
      must_succeed: true
    observe: snapshot.json attempt state; events.json ordering
hard_assertions:
  - id: HA-1
    oracle: goal_state_equals
    check: The goal reaches the exact durable state SUCCEEDED after the
      read_only run (task.json / snapshot.json goal.state == SUCCEEDED).
    evaluate:
      oracle: json_field_equals
      file: snapshot.json
      field: goal.state
      expected: SUCCEEDED
  - id: HA-2
    oracle: stable_task_id
    check: The goal id is stable and durable: exactly one goal exists and its
      id starts with lt_ (task.json count == 1).
    evaluate:
      oracle: json_field_equals
      file: task.json
      field: count
      expected: 1
  - id: HA-3
    oracle: event_order
    check: The durable event log shows creation, plan application, attempt
      start and terminal result in order - GoalCreated before
      PlanRevisionApplied before TaskAttemptStarted.
    evaluate:
      oracle: event_order
      sequence: [GoalCreated, PlanRevisionApplied, TaskAttemptStarted]
  - id: HA-4
    oracle: attempt_state_equals
    check: The single attempt terminalizes as SUCCEEDED (snapshot.json
      attempts[-1].state == SUCCEEDED) and there is exactly one attempt.
    evaluate:
      oracle: attempt_state_equals
      expected: SUCCEEDED
  - id: HA-5
    oracle: attempt_count_equals
    check: Exactly one attempt exists for the read_only task (no duplicate or
      retried attempt).
    evaluate:
      oracle: attempt_count_equals
      expected: 1
  - id: HA-6
    oracle: no_external_effect
    check: No event or snapshot entry carries sideEffectClass external_effect;
      the only writable targets were the disposable workspace and the fresh
      durable database.
    evaluate:
      oracle: no_external_effect
  - id: HA-7
    oracle: command_exit_code_equals
    check: The create_goal harness command exited 0.
    evaluate:
      oracle: command_exit_code_equals
      command: create_goal
      expected: 0
evidence_required: [run, command_log, task, events, runtime_snapshot, artifacts, assertions, environment]
llm_review: on_failure
expected_user_outcome: The user creates a read-only long task and sees it run to
  a durable success with a stable task id and a complete audit trail.
cleanup: delete_disposable_workspace
side_effect_class: read_only
